<rect width="1600" height="900" fill="#f7f8f6"/><g font-family="Segoe UI,Arial,sans-serif"><text x="80" y="95" font-size="52" font-weight="600" fill="#182622">A small test. A concrete improvement.</text><text x="80" y="147" font-size="27" font-weight="400" fill="#64736d">14 authored three-report cases. Real Muse calls. Same inspected development batch.</text><text x="80" y="245" font-size="27" font-weight="600" fill="#182622">Recorded outcome</text><text x="820" y="245" font-size="27" font-weight="600" fill="#182622">Before</text><text x="1190" y="245" font-size="27" font-weight="600" fill="#244e48">After</text><path d="M80 276L1520 276" fill="none" stroke="#d7ded9" stroke-width="2"/><text x="80" y="373" font-size="32" font-weight="500" fill="#182622">Expected discrepancies caught</text><text x="820" y="385" font-size="72" font-weight="500" fill="#182622">4 / 9</text><text x="1190" y="385" font-size="72" font-weight="500" fill="#244e48">9 / 9</text><path d="M80 431L1520 431" fill="none" stroke="#d7ded9" stroke-width="2"/><text x="80" y="526" font-size="32" font-weight="500" fill="#182622">False flags</text><text x="820" y="538" font-size="72" font-weight="500" fill="#182622">5</text><text x="1190" y="538" font-size="72" font-weight="500" fill="#244e48">0</text><path d="M80 585L1520 585" fill="none" stroke="#d7ded9" stroke-width="2"/><text x="80" y="655" font-size="30" font-weight="600" fill="#182622">The change: typed comparison rules. Muse weights did not change.</text><text x="80" y="715" font-size="25" font-weight="400" fill="#64736d">AI-authored labels; development-tuned. Not independent, held-out or clinical accuracy.</text><text x="80" y="759" font-size="25" font-weight="400" fill="#64736d">Reviewed CSV records only. This does not measure scanned-report extraction.</text><text x="80" y="843" font-size="22" font-weight="400" fill="#64736d">muse-spark-1.3 · 42 requests per version · Inspectable cases and receipts in the repository.</text></g></svg>