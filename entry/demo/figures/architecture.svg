<rect width="1600" height="900" fill="#f7f8f6"/><g font-family="Segoe UI,Arial,sans-serif"><text x="80" y="95" font-size="48" font-weight="600" fill="#182622">The model proposes. Your history stays accountable.</text><text x="80" y="144" font-size="27" font-weight="400" fill="#64736d">Shipped product architecture</text><rect x="80" y="220" width="315" height="190" rx="12" fill="#ffffff" stroke="#d7ded9"/><text x="104" y="268" font-size="29" font-weight="600" fill="#182622">Original files</text><text x="104" y="321" font-size="21" font-weight="400" fill="#64736d">PDF, image, CSV or text</text><text x="104" y="355" font-size="21" font-weight="400" fill="#64736d">Untrusted input</text><path d="M402 315L447 315" fill="none" stroke="#244e48" stroke-width="2" marker-end="url(#arrow)"/><rect x="455" y="220" width="315" height="190" rx="12" fill="#e9efeb" stroke="#d7ded9"/><text x="479" y="268" font-size="29" font-weight="600" fill="#182622">Muse Spark</text><text x="479" y="321" font-size="21" font-weight="400" fill="#64736d">Extract → verify → inventory</text><text x="479" y="355" font-size="21" font-weight="400" fill="#64736d">A reviewable proposal</text><path d="M777 315L822 315" fill="none" stroke="#244e48" stroke-width="2" marker-end="url(#arrow)"/><rect x="830" y="220" width="315" height="190" rx="12" fill="#ffffff" stroke="#d7ded9"/><text x="854" y="268" font-size="29" font-weight="600" fill="#182622">Your review</text><text x="854" y="321" font-size="21" font-weight="400" fill="#64736d">Inspect, correct, approve</text><text x="854" y="355" font-size="21" font-weight="400" fill="#64736d">Transactional save</text><path d="M1152 315L1197 315" fill="none" stroke="#244e48" stroke-width="2" marker-end="url(#arrow)"/><rect x="1205" y="220" width="315" height="190" rx="12" fill="#ffffff" stroke="#d7ded9"/><text x="1229" y="268" font-size="29" font-weight="600" fill="#182622">Encrypted history</text><text x="1229" y="321" font-size="21" font-weight="400" fill="#64736d">SQLCipher + OS-held keys</text><text x="1229" y="355" font-size="21" font-weight="400" fill="#64736d">Originals + saved versions</text><path d="M1360 410L1360 510" fill="none" stroke="#244e48" stroke-width="2" marker-end="url(#arrow)"/><text x="80" y="470" font-size="25" font-weight="600" fill="#244e48">Read path</text><rect x="80" y="520" width="315" height="190" rx="12" fill="#ffffff" stroke="#d7ded9"/><text x="104" y="568" font-size="25" font-weight="600" fill="#182622">Your question</text><text x="104" y="621" font-size="20" font-weight="400" fill="#64736d">Historical scope captured</text><text x="104" y="655" font-size="20" font-weight="400" fill="#64736d">Both temporal cutoffs</text><path d="M402 615L447 615" fill="none" stroke="#244e48" stroke-width="2" marker-end="url(#arrow)"/><rect x="455" y="520" width="315" height="190" rx="12" fill="#e9efeb" stroke="#d7ded9"/><text x="479" y="568" font-size="25" font-weight="600" fill="#182622">Muse investigation</text><text x="479" y="621" font-size="20" font-weight="400" fill="#64736d">Read selected + related files</text><text x="479" y="655" font-size="20" font-weight="400" fill="#64736d">No write tools</text><path d="M777 615L822 615" fill="none" stroke="#244e48" stroke-width="2" marker-end="url(#arrow)"/><rect x="830" y="520" width="315" height="190" rx="12" fill="#ffffff" stroke="#d7ded9"/><text x="854" y="568" font-size="25" font-weight="600" fill="#182622">Typed findings</text><text x="854" y="621" font-size="20" font-weight="400" fill="#64736d">Compare recorded context</text><text x="854" y="655" font-size="20" font-weight="400" fill="#64736d">Check exact evidence support</text><path d="M1152 615L1197 615" fill="none" stroke="#244e48" stroke-width="2" marker-end="url(#arrow)"/><rect x="1205" y="520" width="315" height="190" rx="12" fill="#ffffff" stroke="#d7ded9"/><text x="1229" y="568" font-size="25" font-weight="600" fill="#182622">Open the evidence</text><text x="1229" y="621" font-size="20" font-weight="400" fill="#64736d">Original file + source excerpt</text><text x="1229" y="655" font-size="20" font-weight="400" fill="#64736d">Record and version identity</text><text x="80" y="786" font-size="26" font-weight="500" fill="#182622">Two clocks: when the record happened, and when its reviewed version became available.</text><text x="80" y="838" font-size="23" font-weight="400" fill="#64736d">Corrections create versions. Changed sources invalidate earlier explanations. Offline tools remain usable.</text></g></svg>