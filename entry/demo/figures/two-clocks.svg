<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Occurrence time and availability time</title><desc id="desc">An authored result occurred in April 2019 but arrived in November 2026. A 2025 view includes it only when using files available now, not files known then.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#a8b0aa"/></marker></defs>
<rect width="1920" height="1080" fill="#080b09"/><g transform="translate(92 70)" fill="none" stroke="#f1f3f0" stroke-width="2"><circle r="20"/><ellipse rx="30" ry="9" transform="rotate(-32)"/></g><text x="136" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="600" fill="#f1f3f0">modus</text><text x="1450" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#a8b0aa">Two clocks, one record</text><text x="92" y="228" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="550" fill="#f1f3f0">The result is old.</text><text x="92" y="318" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="550" fill="#f1f3f0">The knowledge is new.</text><text x="96" y="385" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#a8b0aa">A late report changes today’s view without rewriting yesterday’s.</text><text x="96" y="506" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#a8b0aa">When it happened</text><path d="M96 554 L1800 554" fill="none" stroke="#6b746d" stroke-width="2" marker-end="url(#arrow)"/><text x="96" y="722" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#a8b0aa">When Modus received it</text><path d="M96 770 L1800 770" fill="none" stroke="#6b746d" stroke-width="2" marker-end="url(#arrow)"/><circle cx="470" cy="554" r="10" fill="#f1f3f0"/><text x="370" y="609" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="550" fill="#f1f3f0">12 April 2019</text><circle cx="1580" cy="770" r="10" fill="#f1f3f0"/><text x="1480" y="825" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="550" fill="#f1f3f0">4 November 2026</text><path d="M1100 480 L1100 895" fill="none" stroke="#78837a" stroke-width="2" stroke-dasharray="7 8"/><text x="1000" y="464" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#f1f3f0">View as of 2025</text><text x="96" y="980" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="400" fill="#f1f3f0">Files available now: included</text><text x="1010" y="980" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="400" fill="#f1f3f0">Files available in 2025: excluded</text><text x="96" y="1031" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#a8b0aa">Illustration of the demonstrated authored late-arrival report. Both dates and the original are preserved.</text></svg>