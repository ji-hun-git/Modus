<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Modus Records system architecture</title><desc id="desc">A source file passes local controls, Muse extraction, verification and row inventory, then human approval before transactional encrypted storage. Questions use captured scope, read-only tools and checked evidence.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#a8b0aa"/></marker></defs>
<rect width="1920" height="1080" fill="#080b09"/><g transform="translate(92 70)" fill="none" stroke="#f1f3f0" stroke-width="2"><circle r="20"/><ellipse rx="30" ry="9" transform="rotate(-32)"/></g><text x="136" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="600" fill="#f1f3f0">modus</text><text x="1430" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#a8b0aa">System architecture</text><text x="80" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="550" fill="#f1f3f0">Models read. You decide what becomes history.</text><text x="82" y="254" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#a8b0aa">The model proposes. Reviewed transactions own the write boundary.</text><g opacity="1"><rect x="80" y="350" width="250" height="300" rx="12" fill="none" stroke="#424a44" stroke-width="1.5"/><text x="108" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="550" fill="#f1f3f0">Your files</text><text x="108" y="452" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#a8b0aa">PDF · Image</text><text x="108" y="489" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#a8b0aa">CSV · Text</text><path d="M108 520 L302 520" fill="none" stroke="#424a44" stroke-width="2"/><text x="108" y="560" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#f1f3f0">Local access</text><text x="108" y="598" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#a8b0aa">Input limits + guard</text></g><g opacity="1"><rect x="410" y="350" width="440" height="300" rx="12" fill="#f1f3f0" stroke="#f1f3f0" stroke-width="1.5"/><text x="440" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="600" fill="#080b09">Muse Spark 1.3</text><text x="440" y="456" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#080b09">Extract</text><text x="440" y="485" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#49534b">Schema-checked fields</text><text x="440" y="522" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#080b09">Verify</text><text x="440" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#49534b">Check proposed evidence</text><text x="440" y="588" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#080b09">Inventory</text><text x="440" y="617" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#49534b">Read source for possible omissions</text></g><g opacity="1"><rect x="930" y="350" width="310" height="300" rx="12" fill="none" stroke="#424a44" stroke-width="1.5"/><text x="960" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="550" fill="#f1f3f0">Your review</text><text x="960" y="456" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#f1f3f0">Compare with source</text><text x="960" y="497" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#f1f3f0">Correct or exclude</text><text x="960" y="538" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#f1f3f0">Select missing rows</text><rect x="960" y="577" width="248" height="44" rx="6" fill="#f1f3f0" stroke="#f1f3f0" stroke-width="1.5"/><text x="995" y="607" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#080b09">Approve + save</text></g><g opacity="1"><rect x="1320" y="350" width="520" height="300" rx="12" fill="none" stroke="#424a44" stroke-width="1.5"/><text x="1350" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="550" fill="#f1f3f0">Encrypted local history</text><text x="1350" y="457" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#a8b0aa">Original files + source excerpts</text><text x="1350" y="500" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#a8b0aa">Reviewed versions + conflicting values</text><text x="1350" y="543" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#a8b0aa">Recorded time + availability time</text><path d="M1350 576 L1810 576" fill="none" stroke="#424a44" stroke-width="2"/><text x="1350" y="618" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#f1f3f0">SQLCipher · key in OS credential store</text></g><path d="M337 500 L396 500" fill="none" stroke="#a8b0aa" stroke-width="2" marker-end="url(#arrow)"/><path d="M857 500 L916 500" fill="none" stroke="#a8b0aa" stroke-width="2" marker-end="url(#arrow)"/><path d="M1247 500 L1306 500" fill="none" stroke="#a8b0aa" stroke-width="2" marker-end="url(#arrow)"/><text x="82" y="722" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#a8b0aa">Read-only questions</text><rect x="80" y="755" width="1760" height="175" rx="12" fill="#121713" stroke="#424a44" stroke-width="1.5"/><text x="110" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="550" fill="#f1f3f0">Capture the scope</text><text x="110" y="861" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#a8b0aa">Recorded date + available files</text><text x="560" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="550" fill="#f1f3f0">Plan a bounded query</text><text x="560" y="861" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#a8b0aa">Muse or offline route</text><text x="1000" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="550" fill="#f1f3f0">Run typed tools</text><text x="1000" y="861" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#a8b0aa">Filter · compare · count</text><text x="1420" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="550" fill="#f1f3f0">Verify the answer</text><text x="1420" y="861" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#a8b0aa">Checked claims + original source</text><path d="M498 824 L537 824" fill="none" stroke="#a8b0aa" stroke-width="2" marker-end="url(#arrow)"/><path d="M938 824 L977 824" fill="none" stroke="#a8b0aa" stroke-width="2" marker-end="url(#arrow)"/><path d="M1358 824 L1397 824" fill="none" stroke="#a8b0aa" stroke-width="2" marker-end="url(#arrow)"/><path d="M1580 657 V706 H1170 V741" fill="none" stroke="#a8b0aa" stroke-width="2" marker-end="url(#arrow)"/><text x="82" y="995" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#f1f3f0">Models cannot commit records, execute SQL or shell commands, or choose arbitrary URLs.</text><text x="82" y="1033" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#a8b0aa">Local parsers and deterministic guards remain available offline. SAM and hosted Guard are not part of this shipped flow.</text></svg>