<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A 2019 result received in 2026 appears with current files but is excluded from files available in 2025.</title><desc id="desc">A 2019 result received in 2026 appears with current files but is excluded from files available in 2025.. Authored Modus illustration; no clinical interpretation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#244e48" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="900" fill="#f7f8f6"/><g font-family="Segoe UI,Arial,sans-serif"><text x="80" y="100" font-size="54" font-weight="600" fill="#182622">An old result can be new evidence.</text><text x="80" y="155" font-size="30" font-weight="400" fill="#64736d">Occurrence and availability are different dates.</text><path d="M140 365L1460 365" fill="none" stroke="#244e48" stroke-width="3"/><circle cx="160" cy="365" r="10" fill="#244e48"/><text x="90" y="287" font-size="58" font-weight="500" fill="#182622">2019</text><text x="90" y="428" font-size="29" font-weight="600" fill="#182622">Result recorded</text><text x="90" y="471" font-size="22" font-weight="400" fill="#64736d">12 April</text><circle cx="810" cy="365" r="10" fill="#244e48"/><text x="740" y="287" font-size="58" font-weight="500" fill="#182622">2025</text><text x="740" y="428" font-size="29" font-weight="600" fill="#182622">Historical view</text><text x="740" y="471" font-size="22" font-weight="400" fill="#64736d">Files available by 31 December</text><circle cx="1440" cy="365" r="10" fill="#244e48"/><text x="1210" y="287" font-size="58" font-weight="500" fill="#182622">2026</text><text x="1210" y="428" font-size="29" font-weight="600" fill="#182622">File received</text><text x="1210" y="471" font-size="22" font-weight="400" fill="#64736d">4 November</text><rect x="80" y="550" width="680" height="200" rx="12" fill="#ffffff" stroke="#d7ded9"/><text x="116" y="610" font-size="30" font-weight="600" fill="#182622">Using today&#x27;s files</text><text x="116" y="650" font-size="22" font-weight="400" fill="#64736d">The 2019 result appears in the history.</text><rect x="840" y="550" width="680" height="200" rx="12" fill="#e9efeb" stroke="#d7ded9"/><text x="876" y="610" font-size="30" font-weight="600" fill="#182622">Using files available in 2025</text><text x="876" y="650" font-size="22" font-weight="400" fill="#64736d">The late-arriving file stays outside this view.</text><text x="80" y="838" font-size="25" font-weight="400" fill="#64736d">Same recorded-date cutoff. Different availability cutoff. No earlier knowledge is rewritten.</text></g></svg>